kind = "web"
previewPath = "/"
title = "AgileMaps"
description = "A frontend-only landing page for AgileMaps, a platform for discovering, exploring, and building visual roadmaps for skills, technologies, and goals."
version = "1.0.0"
id = "artifacts/agilemaps"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21053

[services.development]
run = "pnpm --filter @workspace/agilemaps run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agilemaps", "run", "build" ]
serve = "static"
publicDir = "artifacts/agilemaps/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21053"
BASE_PATH = "/"
